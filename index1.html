<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designing With Data</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="before">

        <h1 class="map_text">Map of the World</h1>
        <p class="map_text">Click on a pin to view information about that city!</p>

    </section>

    <section id="map">

        <img id="pin_T" src="images/pin.png">
        <img id="pin_R" src="images/pin.png">
        <img id="pin_S" src="images/pin.png">
        <img id="pin_B" src="images/pin.png">

    </section>

    <section id="after">

        <h1 class="map_text">Cities Included:</h1>
        <p class="map_text">Toronto, New York, Rome, Vienna, Shanghai, and Beijing</p>

    </section>

    <script src="script.js"></script> 
</body>
</html>
