<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designing With Data</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <p class="t_text">Location: <span id="place">Loading..</span> </p>

    <div class="bars">
        <p class="b_text">The temperature is <span id="temp_Search">Loading..</span>°C </p>
        <div class="bar_Location">
            <div id="temp"></div>
        </div>
        <p class="b_text">Cloudiness is <span id="cloud_Search">Loading..</span>% </p>
        <div class="bar_Location">
            <div id="cloud"></div>
        </div>
        <p class="b_text">Raininess is <span id="rain_Search">Loading..</span>mm </p>
        <div class="bar_Location">
            <div id="rain"></div>
        </div>
        <p class="b_text">Snowiness is <span id="snow_Search">Loading..</span>cm </p>
        <div class="bar_Location">
            <div id="snow"></div>
        </div>
    </div>


    <script src="scriptSearch.js"></script> 
</body>
</html>
